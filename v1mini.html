<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory Test</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f0f14;
    color: white;
    font-family: Arial;
}

/* panel */
.panel {
    width: 500px;
    height: 300px;
    background: #1a1a24;
    border-radius: 16px;
    padding: 15px;

    display: flex;
    gap: 20px;
}

/* item grid */
.items {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    gap: 10px;
}

/* item slots */
.item {
    width: 60px;
    height: 60px;
    background: #2a2a3a;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.item:hover {
    background: #3a3a55;
}

/* info panel */
.info-panel {
    flex: 1;
    background: #14141c;
    border-radius: 10px;
    padding: 10px;
}
.cover {
    background: black;
    width: 100%;
    height: 100%;
}
.coverh3 {
    color: white;
    text-align: center;
    margin-top: 50px;
}

</style>
</head>
