<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOORS Badge Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #17151c;
      font-family: system-ui, sans-serif;
      color: white;
    }

    .card {
      text-align: center;
      padding: 32px;
      border-radius: 18px;
      background: #24212b;
      box-shadow: 0 10px 40px #0008;
    }

    .badge {
      width: 96px;
      height: 96px;
      object-fit: contain;
      image-rendering: auto;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 20px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Vision</h1>

    <img
      class="badge"
      src="https://gitlab.com/AmethystOS04/DOORSBADGEGRADIENTS/-/raw/main/BadgeOutlineFull_32f84f.png"
      alt="32f84f badge"
    >
  </main>
  <main class="card">
    <h1>CrucfixScary</h1>

    <img
      class="badge"
      src="https://gitlab.com/AmethystOS04/DOORSBADGEGRADIENTS/-/raw/main/BadgeOutlineFull_CrucifixScary.png"
      alt="crucfixscary badge"
    >
  </main>
</body>
</html>
