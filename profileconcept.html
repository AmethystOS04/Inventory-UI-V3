<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inv-UI-V2-profiles</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

background:  conic-gradient(#3c0e62, #4a082a, #3c0e62);
    color: white;
    font-family: Arial;
}

/* panel */
.panel {
   
    width: 1352px;
    height: 700px;
    background: #1a1a24;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    gap: 20px;
}

.profile-pic{
    width: 200px;
    height: 200px;
    border-radius: 100px;
    background: #2a002e;
    display: flex;
    justify-content: center;
    align-items: center;
}

.profile-desc-box{
    flex: 1;
    background: #2a002e;
    border-radius: 20px;
    padding: 20px;
    width: 800px;
    height: 500px;
    display: flex;
}

.profile-desc-box-h1{
    margin: 0;
    font-size: 32px;
    text-shadow: 0 0 12px #ff00ff;
    position: relative;
}
    </style>
</head>
<body>
    <div class="panel">
        <div class="profile-pic">
            <img src="tag-ap.png" width="120px">
        </div>

        <div class="profile-desc-box">
            <h1>Profile Name: Tag AP</h1>

            <div class="profile-desc-box-h1">
                this a desc
            </div>

             
    
            
        
        </div>
    </div>
